user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /run/nginx.pid;
events { worker_connections 1024; }
http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  server_tokens off;
  access_log off;
  sendfile on;
  keepalive_timeout 60;
  server {
    listen 80 default_server;
    server_name 138.2.185.151;
    location ^~ /.well-known/acme-challenge/ { root /var/lib/neural-acme; }
    location / { return 308 https://138.2.185.151$request_uri; }
  }
  server {
    listen 443 ssl default_server;
    server_name 138.2.185.151;
    ssl_certificate /etc/letsencrypt/live/138.2.185.151/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/138.2.185.151/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 110m;
    add_header X-Content-Type-Options nosniff always;
    location / {
      proxy_pass http://127.0.0.1:8080;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Proto https;
      proxy_buffering off;
      proxy_read_timeout 75s;
    }
  }
}
